spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:h2:mem:employee-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
server:
  port: 8082
app:
  jwt:
    secret: hrms-dev-secret
    ttl-minutes: 1440
