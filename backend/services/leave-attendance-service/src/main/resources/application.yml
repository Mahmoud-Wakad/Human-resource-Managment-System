spring:
  application:
    name: leave-attendance-service
  datasource:
    url: jdbc:h2:mem:leaveattendancedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
  cloud:
    config:
      uri: http://config-server:8888
eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka
server:
  port: 8085
app:
  jwt:
    secret: hrms-dev-secret
    ttl-minutes: 1440
